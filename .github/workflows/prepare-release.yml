name: Prepare release draft

on:
  push:
    tags: ['release_*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag, e.g. release_0.10.0-rc.1'
        required: true
        type: string

permissions:
  contents: write
  issues: read
  pull-requests: read

concurrency:
  group: release-draft-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Generate notes and create draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: node scripts/prepare-release.mjs
