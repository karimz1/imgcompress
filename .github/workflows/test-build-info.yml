name: Test build metadata

on:
  pull_request:
    paths:
      - 'frontend/scripts/write-build-info.mjs'
      - 'frontend/src/lib/build-info.ts'
      - 'tests/build-info/**'
      - 'Dockerfile'
      - '.github/workflows/test-build-info.yml'
  push:
    branches: [main]
    paths:
      - 'frontend/scripts/write-build-info.mjs'
      - 'frontend/src/lib/build-info.ts'
      - 'tests/build-info/**'
      - 'Dockerfile'
      - '.github/workflows/test-build-info.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Run build metadata tests
        run: node --test tests/build-info/*.test.mjs
