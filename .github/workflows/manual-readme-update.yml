name: Manual Docker Hub Readme Update

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update-dockerhub-description:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.x'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pytest

      - name: Run Tests
        run: |
          pytest tests/test_update_dockerhub_description.py

      - name: Set Environment Variables
        shell: bash
        # GITHUB_REF_NAME is set by the runner; no ${{ }} expansion inside the script.
        run: |
          echo "REF_NAME=$GITHUB_REF_NAME" >> "$GITHUB_ENV"

      - name: Update Docker Hub Description
        run: |
          python update_dockerhub_description.py \
              --readme ReadMe.md \
              --branch "$REF_NAME" \
              --base-url "https://raw.githubusercontent.com/karimz1/imgcompress/$REF_NAME" \
              --repo-url "https://github.com/karimz1/imgcompress/blob/$REF_NAME"
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_PASSWORD: ${{ secrets.DOCKERHUB_TOKEN }}
          DOCKERHUB_REPO: "imgcompress"
