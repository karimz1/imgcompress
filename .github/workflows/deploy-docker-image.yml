name: Deployment for imgcompress to Docker Hub

on:
  push:
    branches:
      - main
  release:
    types: [published]
  workflow_dispatch:
  repository_dispatch:
    types: [ deploy ]

permissions:
  contents: read

jobs:
  deploy-image-to-dockerhub:
    if: github.event_name != 'release' || startsWith(github.event.release.tag_name, 'release_')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write  # needed for pushing to GHCR with GITHUB_TOKEN
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || github.event.client_payload.ref || github.ref }}
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Compute image tags
        id: tags
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || '' }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease || false }}
          DEPLOY_REF: ${{ github.event.client_payload.ref || github.ref }}
        run: node scripts/docker-image-tags.mjs

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Authenticate to dhi.io for DHI base images
        uses: docker/login-action@v4
        with:
          registry: dhi.io
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Debug - Display Computed Tags
        shell: bash
        env:
          TAGS_OUTPUT: ${{ steps.tags.outputs.tags }}
          VERSION_OUTPUT: ${{ env.VERSION }}
        run: |
          echo "::group::🏷️ Computed Docker Image Tags"
          echo "VERSION: $VERSION_OUTPUT"
          echo ""
          echo "Tags that will be pushed:"
          IFS=',' read -ra TAG_ARRAY <<< "$TAGS_OUTPUT"
          for tag in "${TAG_ARRAY[@]}"; do
            echo "  • $tag"
          done
          echo "::endgroup::"

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha,scope=app-deploy
          cache-to: type=gha,mode=max,scope=app-deploy

  update-dockerhub-description:
    needs: deploy-image-to-dockerhub
    if: github.event_name == 'release' && !github.event.release.prerelease && startsWith(github.event.release.tag_name, 'release_') && !contains(github.event.release.tag_name, '-')
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Choose README ref
        id: readme-ref
        shell: bash
        run: |
          README_REF="${GITHUB_REF#refs/tags/}"
          echo "README_REF=$README_REF" >> "$GITHUB_ENV"

      - name: Update Docker Hub Description
        run: |
          python update_dockerhub_description.py \
              --readme ReadMe.md \
              --branch "$README_REF" \
              --base-url "https://raw.githubusercontent.com/karimz1/imgcompress/$README_REF"
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_PASSWORD: ${{ secrets.DOCKERHUB_TOKEN }}
          DOCKERHUB_REPO: "imgcompress"
