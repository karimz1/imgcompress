name: Build & Push Multi-Arch Docker Image Every 2nd Month

on:
  schedule:
    - cron: '0 0 1 */2 *'  # Every 2nd month on the 1st
  workflow_dispatch:
  push:
    branches:
      - 'devcontainer/*'
      - 'devcontainer/**'
    tags:
      - 'devcontainer_update*'

permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Docker Buildx (multi-arch)
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set date-based tag
        id: tag
        run: |
          DATE_TAG=$(date +'%Y-%m')
          echo "tag=$DATE_TAG" >> $GITHUB_OUTPUT

      - name: Build and push multi-arch image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: .devcontainer/Dockerfile.base
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ github.repository_owner }}/devcontainer-image-only-for-devs:${{ steps.tag.outputs.tag }}
