name: Test release notes sync

on:
  pull_request:
    paths:
      - '.github/workflows/sync-release-notes.yml'
      - '.github/workflows/test-release-notes.yml'
      - '.github/workflows/deploy-docker-image.yml'
      - 'scripts/sync-release-notes.mjs'
      - 'scripts/prepare-release.mjs'
      - 'frontend/src/lib/release-version.ts'
      - 'frontend/src/hooks/useVersionCheck.ts'
      - 'tests/release-notes/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-release-notes.yml'
      - '.github/workflows/test-release-notes.yml'
      - '.github/workflows/deploy-docker-image.yml'
      - 'scripts/sync-release-notes.mjs'
      - 'scripts/prepare-release.mjs'
      - 'frontend/src/lib/release-version.ts'
      - 'frontend/src/hooks/useVersionCheck.ts'
      - 'tests/release-notes/**'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'

      - name: Run release notes tests
        run: node --test tests/release-notes/*.test.mjs
