# Advanced Docker Compose deployment for ImgCompress:
# the minimal root setup plus common container best practices
# (log rotation, healthcheck, ulimits, no-new-privileges).

# YAML anchors - reusable default settings shared across services.
x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "50m"
    max-file: "10"
    compress: "true"
x-healthcheck: &default-healthcheck
  interval: 30s
  retries: 3
  timeout: 10s
  start_period: 10s

# Dedicated bridge network, so containers from other Compose stacks
# on this host cannot reach ImgCompress directly.
networks:
  imgcompress-network:
    driver: bridge

services:
  imgcompress:
    image: ${IMGCOMPRESS_IMAGE:-karimz1/imgcompress}:${IMGCOMPRESS_TAG:-latest}
    container_name: imgcompress
    restart: always
    networks:
      - imgcompress-network
    ports:
      # Reachable from your network by default: http://<server-ip>:3001
      # To restrict access to this machine only, set IMGCOMPRESS_HOST=127.0.0.1 in `.env`.
      # Note: the app has no login, so anyone on the network can use it.
      - "${IMGCOMPRESS_HOST:-0.0.0.0}:${IMGCOMPRESS_PORT:-3001}:5000"
    environment:
      # Set to true to remove the mascot and enable a minimal, mascot-free UI
      - DISABLE_LOGO=${IMGCOMPRESS_DISABLE_LOGO:-false}
      # Optional: largest upload per file in MB, also for editor pictures. Default 40960 (40 GB) for big PSD/PDF files; remove the line to keep it.
      # For a public instance, use a smaller limit like 1 GB (1024).
      - MAX_UPLOAD_SIZE_MB=${IMGCOMPRESS_MAX_UPLOAD_SIZE_MB:-40960}
      # Set to true to disable the storage management features (e.g., for your users to not see all the files)
      - DISABLE_STORAGE_MANAGEMENT=${IMGCOMPRESS_DISABLE_STORAGE_MANAGEMENT:-false}
      # Optional: "Notify me when done" (opt-in per job). Apprise URL the container
      # sends a short message to when a job finishes: image count and device/browser,
      # never file names or images. Default: not set = feature off, switch hidden.
      # Example for the optional ntfy service below:
      # - NOTIFY_URL=ntfy://ntfy/imgcompress
      # Optional: the address users open ImgCompress at. It is added on its own
      # line so people find their way back. ImgCompress never guesses it from a
      # request (the Host header can be faked), so set it yourself. Must be
      # http(s), without user/password; an invalid value is ignored with a
      # warning. Default: not set = no address in the message. Example:
      # - PUBLIC_BASE_URL=http://192.168.1.10:3001
    healthcheck:
      test: ["CMD", "python", "/container/healthcheck.py"]
      <<: *default-healthcheck
    # Prevent container from causing Docker host run out of file descriptors
    # (default limit of Linux is 65535)
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    # Give the container 15s to shut down gracefully before Docker sends SIGKILL.
    stop_grace_period: 15s
    # Prevent the process from gaining new privileges, e.g. via setuid binaries
    # (mitigates privilege-escalation paths).
    security_opt:
      - no-new-privileges:true
    logging:
      <<: *default-logging

  # Optional: ntfy, self-hosted push notifications (https://ntfy.sh).
  # Why: long jobs such as AI upscaling can take minutes. With ntfy you can close
  # the tab and get a message on your phone or desktop when the job is done.
  # How: uncomment this service and NOTIFY_URL above, then subscribe to the
  # topic "imgcompress" in the ntfy app (iOS, Android, web).
  # iPhone: NTFY_UPSTREAM_BASE_URL lets ntfy.sh wake the iOS app; the message
  # itself is fetched from this server, so away from home you need a VPN
  # (e.g. WireGuard, Tailscale). Full guide: docker/compose/ntfy.docker-compose.yaml
  # ntfy:
  #   image: binwiederhier/ntfy:latest
  #   container_name: ntfy
  #   restart: always
  #   command: serve
  #   ports:
  #     - "8080:80"
  #   networks:
  #     - imgcompress-network
  #   environment:
  #     # Address your phone uses to reach this ntfy server.
  #     - NTFY_BASE_URL=http://192.168.1.10:8080
  #     - NTFY_UPSTREAM_BASE_URL=https://ntfy.sh
